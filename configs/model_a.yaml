model:
  backbone: tf_efficientnetv2_s
  pretrained: true
  dropout: 0.3
  freeze_backbone: false

training:
  loss_type: focal
  pos_weight: 1.0
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  max_epochs: 80
  batch_size: 32
  early_stopping_patience: 10
  early_stopping_monitor: val/auprc
  early_stopping_mode: max

linear_probe:
  max_epochs: 10
  learning_rate: 0.01

data:
  image_size: 384
  n_folds: 5
  seed: 42

ablation:
  # Also train with focal loss for comparison
  focal_loss:
    loss_type: focal
    focal_gamma: 2.0
