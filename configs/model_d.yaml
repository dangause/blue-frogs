model:
  backbone: dinov3
  model_size: large
  hidden_dim: 256
  dropout: 0.3
  pretrained: true

training:
  loss_type: focal
  pos_weight: 1.0
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.01
  max_epochs: 80
  batch_size: 16
  early_stopping_patience: 10
  early_stopping_monitor: val/auprc
  early_stopping_mode: max

linear_probe:
  freeze_backbone: true
  max_epochs: 20
  learning_rate: 0.001

finetune:
  freeze_backbone: false
  backbone_lr_factor: 0.01  # Note: currently hardcoded in configure_optimizers (same as model_c)
  max_epochs: 80

data:
  image_size: 384
  n_folds: 5
  seed: 42
